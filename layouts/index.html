{{ define "main" }}
<main>
    <article>
      <div class="mx-auto">
        <div class="relative overflow-hidden">
          <div class="relative h-screen">
            <div>
              <a href="https://cloud66.com">
                <img class="absolute inset-0 h-8 w-8 mt-4 ml-4" src="/logo.svg" alt="Cloud 66 Prepress" />
              </a>
            </div>
            <h1 class="text-center text-4xl font-extrabold tracking-tight sm:text-5xl lg:text-6xl pt-24">          
              <span class="block">QUERY PARAMS</span>
            </h1>
            <p class="mt-6 max-w-lg mx-auto text-center text-xl text-orange-200 sm:max-w-3xl">
              <table id="queryParamsTable" class="mx-auto">
                <thead>
                  <tr>
                    <th class="px-4 py-2">Parameter</th>
                    <th class="px-4 py-2">Value</th>
                  </tr>
                </thead>
                <tbody id="queryParamsBody">
                </tbody>
              </table>
              <script>
                const params = new URLSearchParams(window.location.search);
                const tbody = document.getElementById('queryParamsBody');
                params.forEach((value, key) => {
                  const row = document.createElement('tr');
                  row.innerHTML = `
                    <td class="border px-4 py-2">${key}</td>
                    <td class="border px-4 py-2">${value}</td>
                  `;
                  tbody.appendChild(row);
                });
              </script>
            </p>            
          </div>
        </div>
      </div>
    </article>
  </main>
{{ end }}
